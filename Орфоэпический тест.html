<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>Орфоэпический тренажёр</title>
<script>
(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.dataset.theme='dark';}catch(e){}})();
</script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root,[data-theme="light"]{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#f0f2f5;
  --border:#e6e8ec;
  --border-soft:#eef0f3;
  --text:#12161b;
  --text-soft:#525a66;
  --muted:#8e96a3;
  --accent:#3d7bfa;
  --accent-soft:rgba(61,123,250,.1);
  --ok:#0e9f59;
  --ok-soft:rgba(14,159,89,.12);
  --err:#e04347;
  --err-soft:rgba(224,67,71,.12);
  --warn:#f0a020;
  --warn-soft:rgba(240,160,32,.14);
  --radius:16px;
  color-scheme:light;
}

[data-theme="dark"]{
  --bg:#1c2026;
  --surface:#242930;
  --surface-2:#2d333b;
  --border:#353b45;
  --border-soft:#2c313a;
  --text:#eef0f4;
  --text-soft:#b4bac4;
  --muted:#77808d;
  --accent:#7ea6ff;
  --accent-soft:rgba(126,166,255,.14);
  --ok:#4fce83;
  --ok-soft:rgba(79,206,131,.14);
  --err:#f47373;
  --err-soft:rgba(244,115,115,.14);
  --warn:#fbbf24;
  --warn-soft:rgba(251,191,36,.14);
  color-scheme:dark;
}

html,body{height:100%}
html{-webkit-text-size-adjust:100%}

body{
  min-height:100dvh;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
  display:flex;
  transition:background .3s,color .3s;
}

.hidden{display:none!important}

.app{
  flex:1;
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:14px;
}

@media(min-width:768px){
  body{padding:24px}
  .app{max-width:680px;padding:24px 28px;gap:18px}
}

@media(min-width:1100px){
  .app{max-width:820px}
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  font-size:11px;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
}

@media(min-width:768px){
  .brand{font-size:12px}
}

.header-right{display:flex;align-items:center;gap:10px}

.round{font-size:13px;color:var(--muted)}
.round b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

.icon-btn{
  width:34px;height:34px;
  display:inline-flex;align-items:center;justify-content:center;
  padding:0;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--surface);
  color:var(--text-soft);
  cursor:pointer;
  transition:background .15s,color .15s,border-color .15s,transform .1s;
}

.icon-btn:hover{color:var(--text);border-color:var(--muted)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:16px;height:16px;display:block}
.icon-btn .icon-sun{display:none}
[data-theme="dark"] .icon-btn .icon-sun{display:block}
[data-theme="dark"] .icon-btn .icon-moon{display:none}

.progress{
  height:3px;
  border-radius:3px;
  background:var(--border-soft);
  overflow:hidden;
}

.progress i{
  display:block;
  height:100%;
  width:0;
  background:var(--accent);
  border-radius:3px;
  transition:width .4s cubic-bezier(.4,0,.2,1);
}

.stage{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 0;
  text-align:center;
  animation:fade .4s ease;
}

@keyframes fade{from{opacity:0;transform:translateY(6px)}}

.picker{
  display:flex;flex-direction:column;
  align-items:center;gap:20px;
  max-width:360px;
}

.picker p{font-size:14px;color:var(--muted);line-height:1.6}
.picker p b{color:var(--text);font-weight:600}

.picker-actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:100%;
  max-width:280px;
}

.game{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  width:100%;
}

.word{
  font-size:clamp(34px,9vw,56px);
  font-weight:600;
  line-height:1.15;
  letter-spacing:.005em;
  word-break:break-word;
  user-select:none;
  -webkit-user-select:none;
}

@media(min-width:768px){
  .word{font-size:64px}
}

.letter{display:inline-block;animation:pop .2s ease backwards}

@keyframes pop{from{opacity:0;transform:translateY(4px)}}

.vowel{
  cursor:pointer;
  padding:.04em .08em;
  border-radius:8px;
  box-shadow:inset 0 -.09em 0 var(--border);
  transition:background .15s,color .15s,box-shadow .15s,transform .1s;
}

@media(hover:hover){
  .vowel:hover{background:var(--accent-soft);box-shadow:inset 0 -.09em 0 var(--accent)}
}

.vowel:active{transform:scale(.94)}
.vowel:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.vowel.correct{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 -.09em 0 var(--ok)}
.vowel.wrong{background:var(--err-soft);color:var(--err);box-shadow:inset 0 -.09em 0 var(--err)}

.hint{
  font-size:13px;
  color:var(--muted);
  max-width:36ch;
  min-height:1.4em;
  line-height:1.5;
}

@media(min-width:768px){
  .hint{font-size:14px}
}

.feedback{
  font-size:14px;
  min-height:1.5em;
  max-width:44ch;
  line-height:1.5;
  font-weight:600;
}

@media(min-width:768px){
  .feedback{font-size:15px}
}

.feedback.ok{color:var(--ok)}
.feedback.err{color:var(--err);font-weight:500}
.feedback.err b{font-weight:700}

.feedback .note{
  display:block;
  margin-top:6px;
  font-size:12px;
  font-weight:400;
  color:var(--muted);
  font-style:italic;
  line-height:1.45;
}

.finish{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  width:100%;
  animation:fade .4s ease;
}

.finish[data-tone="perfect"]  {--tone:#f0a020;--tone-soft:rgba(240,160,32,.14)}
.finish[data-tone="excellent"]{--tone:var(--ok);--tone-soft:var(--ok-soft)}
.finish[data-tone="great"]    {--tone:var(--ok);--tone-soft:var(--ok-soft)}
.finish[data-tone="good"]     {--tone:var(--accent);--tone-soft:var(--accent-soft)}
.finish[data-tone="okay"]     {--tone:var(--warn);--tone-soft:var(--warn-soft)}
.finish[data-tone="weak"]     {--tone:#f97316;--tone-soft:rgba(249,115,22,.14)}
.finish[data-tone="bad"]      {--tone:var(--err);--tone-soft:var(--err-soft)}

.finish-badge{
  width:80px;height:80px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--tone-soft);
  margin-bottom:8px;
  transition:background .3s;
  animation:pop .4s ease;
}

.finish-emoji{font-size:38px;line-height:1}

.finish h2{
  font-size:clamp(20px,5vw,24px);
  font-weight:700;
  letter-spacing:-.015em;
  color:var(--text);
}

.finish p{
  font-size:14px;
  color:var(--muted);
  max-width:38ch;
  line-height:1.55;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:1px;
  width:100%;
  max-width:440px;
  margin:20px 0 8px;
  background:var(--border);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

@media(min-width:480px){
  .metrics{grid-template-columns:repeat(4,1fr)}
}

.metric{
  background:var(--surface);
  padding:14px 8px;
  display:flex;flex-direction:column;
  align-items:center;gap:3px;
}

.metric span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.metric b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.metric b i{font-style:normal;font-size:11px;font-weight:500;color:var(--muted)}

.btn{
  padding:14px 32px;
  border:0;
  border-radius:12px;
  background:var(--text);
  color:var(--bg);
  font:inherit;font-size:15px;font-weight:600;
  letter-spacing:.01em;
  cursor:pointer;
  width:100%;
  transition:transform .1s,opacity .15s,background .15s,color .15s,border-color .15s;
}

.btn:hover{opacity:.9}
.btn:active{transform:scale(.97)}

.btn-ghost{
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border);
}

.btn-ghost:hover{border-color:var(--muted);opacity:1}

.finish .btn{margin-top:10px;min-width:220px;width:auto}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding-top:14px;
  border-top:1px solid var(--border-soft);
}

.stat{
  display:flex;flex-direction:column;
  align-items:center;gap:2px;
  font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);
}

.stat b{
  font-size:14px;font-weight:600;
  color:var(--text);
  font-variant-numeric:tabular-nums;
  letter-spacing:0;
}

.stat b i{font-style:normal;font-size:11px;font-weight:500;color:var(--muted)}
.stat.ok b{color:var(--ok)}
.stat.err b{color:var(--err)}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <span class="brand">Орфоэпия</span>
    <div class="header-right">
      <span class="round">Круг <b id="roundNum">1</b></span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Сменить тему">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </header>

  <div class="progress"><i id="bar"></i></div>

  <main class="stage">
    <div id="picker" class="picker">
      <p>Выберите источник слов для тренировки</p>
      <div class="picker-actions">
        <button id="builtinBtn" class="btn" type="button">Встроенный словарь</button>
        <button id="fileBtn" class="btn btn-ghost" type="button">Загрузить свой XLSX</button>
      </div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" class="hidden">
    </div>

    <div id="game" class="game hidden">
      <div id="word" class="word"></div>
      <div id="hint" class="hint"></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
    </div>

    <div id="finish" class="finish hidden" data-tone="good">
      <div class="finish-badge"><span class="finish-emoji" id="finishEmoji"></span></div>
      <h2 id="finishTitle"></h2>
      <p id="finishText"></p>
      <div class="metrics" id="finishMetrics"></div>
      <button id="restartBtn" class="btn" type="button">Новый круг</button>
    </div>
  </main>

  <footer class="stats hidden" id="stats">
    <div class="stat"><span>Время</span><b id="timeVal">0:00</b></div>
    <div class="stat"><span>Темп</span><b><span id="speedVal">0</span><i>/мин</i></b></div>
    <div class="stat ok"><span>Верно</span><b id="okCount">0</b></div>
    <div class="stat err"><span>Ошибок</span><b id="errCount">0</b></div>
  </footer>
</div>

<script>
(() => {
'use strict';

const DELAY_OK = 700;
const DELAY_ERR = 2200;
const VOWELS = new Set('аеёиоуыэюя'.split(''));

const BUILTIN = [
  'агЕнт', 'алфавИт', 'арбУз', 'балОванный', 'баловАть', 'бАнты', 'боЯзнь',
  'бухгАлтеров', 'вероисповЕдание', 'взялАсь', 'включЁнный', 'включИм',
  'включИт', 'включИшь', 'влилАсь', 'вОвремя', 'ворвалАсь', 'газопровОд',
  'глИняный', 'гналА', 'гналАсь', 'дешевИзна', 'диспансЕр', 'дОверху',
  'договОр', 'дозвонИтся', 'дозИровать', 'докумЕнт', 'донЕльзя', 'дОнизу',
  'досУг', 'дОсуха', 'дремотА', 'Елей (много деревьев)',
  'Ели (кушать в прошедшем времени)', 'еретИк', 'жалюзИ', 'забралА',
  'зАгнутый', 'занятА', 'зАсветло', 'звонИт', 'Иксы', 'каталОг', 'кАшлять',
  'квартАл', 'клАла', 'комбАйнер', 'корЫсть', 'крАлась', 'крАны', 'красИвее',
  'красИвейший', 'кремЕнь', 'кровоточАщий', 'кровоточИть', 'кУхонный',
  'лЕкторы', 'малЯр', 'мЕстностей', 'мозаИчный', 'молЯщий', 'мусоропровОд',
  'наделИт', 'надорвалАсь', 'нажИвший', 'налИвший', 'намЕрение', 'нанЯвший',
  'насорИт', 'начАв', 'начАвшись', 'нАчатый', 'некролОг', 'нефтепровОд',
  'обеспечЕние', 'ободрИться', 'обострЁнный', 'опОшлить', 'оптОвый',
  'освЕдомиться', 'откУпорив', 'Отрочество', 'партЕр', 'плАнер', 'планЁр',
  'пломбировАть', 'повторЁнный', 'позвонИт', 'понЯвший', 'пОнял', 'понялА',
  'прибЫв', 'призЫв', 'приручЁнный', 'прожИвший', 'рвалА', 'рефлЕксия',
  'свЁкла', 'сверлИт', 'сирОты', 'слИвовый', 'сОгнутый', 'созвонИмся',
  'создАв', 'создалА', 'созЫв', 'сорвалА', 'сосредотОчение', 'средствА',
  'стАтуя', 'танцОвщица', 'твОрог', 'творОг', 'тОрты', 'угналА', 'упрОчение',
  'фенОмен', 'ходАтайство', 'цемЕнт', 'черкАть', 'чЕрпать', 'шАрфы', 'шОрты',
  'щавЕль', 'щекОтно', 'электропровОд (система для передачи электричества)',
  'электропрОвод (электрический шнур)'
];

const ZONES = [
  { max: 0,        emoji: '🏆', title: 'Безупречно',     text: 'Ни единой ошибки. Идеальное владение орфоэпическими нормами.', tone: 'perfect'   },
  { max: 5,        emoji: '🌟', title: 'Блестяще',       text: 'Единичные оговорки — уровень уверенного владения нормами.',    tone: 'excellent' },
  { max: 10,       emoji: '🎯', title: 'Отлично',        text: 'Редкие ошибки, база усвоена прочно.',                          tone: 'great'     },
  { max: 20,       emoji: '👍', title: 'Хорошо',         text: 'Крепкий результат. Осталось отшлифовать детали.',              tone: 'good'      },
  { max: 35,       emoji: '💪', title: 'Неплохо',        text: 'Основное усвоено — стоит повторить слабые места.',             tone: 'okay'      },
  { max: 50,       emoji: '📖', title: 'Нужна практика', text: 'Каждое второе слово пока даётся с трудом.',                    tone: 'weak'      },
  { max: Infinity, emoji: '🧭', title: 'Начало пути',    text: 'Ошибок много, но каждый круг заметно прибавляет.',             tone: 'bad'       }
];

const $ = id => document.getElementById(id);
const ui = {
  picker: $('picker'), game: $('game'),
  word: $('word'), hint: $('hint'), feedback: $('feedback'),
  finish: $('finish'), finishEmoji: $('finishEmoji'),
  finishTitle: $('finishTitle'), finishText: $('finishText'),
  finishMetrics: $('finishMetrics'), roundNum: $('roundNum'),
  bar: $('bar'), stats: $('stats'), timeVal: $('timeVal'),
  speedVal: $('speedVal'), okCount: $('okCount'), errCount: $('errCount'),
  restartBtn: $('restartBtn'), fileInput: $('fileInput'), themeBtn: $('themeBtn'),
  builtinBtn: $('builtinBtn'), fileBtn: $('fileBtn')
};

const fmtTime = s => {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};

const stressedForm = (w, i) => w.slice(0, i) + w[i].toUpperCase() + w.slice(i + 1);

const metric = (label, value) =>
  '<div class="metric"><span>' + label + '</span><b>' + value + '</b></div>';

const escapeHtml = s => String(s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function parseEntry(raw) {
  if (raw == null) return null;
  let s = String(raw).normalize('NFC').replace(/\s+/g, ' ').trim();
  if (!s) return null;

  let hint = '';
  const m = s.match(/\(([^)]*)\)/);
  if (m) {
    hint = m[1].trim();
    s = (s.slice(0, m.index) + s.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim();
  }

  let stress = -1;
  for (let i = 0; i < s.length; i++) {
    if (/[А-ЯЁ]/.test(s[i])) { stress = i; break; }
  }
  if (stress < 0) return null;

  const word = s.toLowerCase();
  if (!VOWELS.has(word[stress])) return null;
  return { word, hint, stress };
}

function buildItems(rows) {
  const byDisplay = new Map();

  for (const raw of rows) {
    const e = parseEntry(raw);
    if (!e) continue;
    const display = e.word.replace(/ё/g, 'е');
    if (!byDisplay.has(display)) byDisplay.set(display, []);
    byDisplay.get(display).push({
      stress: e.stress,
      form: stressedForm(e.word, e.stress),
      hint: e.hint
    });
  }

  const items = [];
  for (const [display, variants] of byDisplay) {
    const byHint = new Map();
    for (const v of variants) {
      if (!byHint.has(v.hint)) byHint.set(v.hint, []);
      byHint.get(v.hint).push(v);
    }

    const isSemantic = byHint.size > 1;

    for (const [hint, group] of byHint) {
      const answers = [];
      for (const g of group) {
        if (!answers.some(a => a.index === g.stress)) {
          answers.push({ index: g.stress, form: g.form });
        }
      }
      answers.sort((a, b) => a.index - b.index);

      items.push({
        id: items.length,
        display,
        hint,
        answers,
        variants: isSemantic ? variants.slice() : null
      });
    }
  }

  return items;
}

function parseWorkbook(buffer) {
  const wb = XLSX.read(buffer, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false });

  const list = [];
  for (const row of rows) {
    if (!row) continue;
    for (const cell of row) {
      if (cell != null && String(cell).trim()) list.push(String(cell));
    }
  }
  return list;
}

let allItems = [];
let queue = [];
let current = null;
let locked = false;
let okTotal = 0;
let errTotal = 0;
let roundErrors = new Set();
let round = 0;
let startTime = 0;
let answerTimer = null;
let tickTimer = null;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const elapsed = () => (performance.now() - startTime) / 1000;

function startWithRows(rows) {
  allItems = buildItems(rows);
  if (!allItems.length) {
    alert('В файле не найдено ни одного слова с указанным ударением.');
    return false;
  }
  ui.picker.classList.add('hidden');
  round = 0;
  startRound();
  return true;
}

function startRound() {
  round++;
  okTotal = 0;
  errTotal = 0;
  roundErrors = new Set();
  queue = shuffle(allItems.map((_, i) => i));
  locked = false;
  clearTimeout(answerTimer);

  ui.roundNum.textContent = round;
  ui.finish.classList.add('hidden');
  ui.game.classList.remove('hidden');
  ui.stats.classList.remove('hidden');
  ui.bar.style.width = '0%';

  startTimer();
  updateStats();
  nextQuestion();
}

function startTimer() {
  startTime = performance.now();
  clearInterval(tickTimer);
  tickTimer = setInterval(tick, 200);
  tick();
}

function tick() {
  const s = elapsed();
  ui.timeVal.textContent = fmtTime(s);
  const done = allItems.length - queue.length;
  ui.speedVal.textContent = s > 0.5 ? Math.round(done / (s / 60)) : 0;
}

function nextQuestion() {
  if (!queue.length) { finishRound(); return; }

  current = allItems[queue[0]];
  locked = false;

  renderWord(current);
  ui.hint.textContent = current.hint ? '«' + current.hint + '»' : '';
  ui.feedback.textContent = '';
  ui.feedback.className = 'feedback';
  updateStats();
}

function renderWord(item) {
  const frag = document.createDocumentFragment();

  [...item.display].forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = ch;

    if (VOWELS.has(ch)) {
      span.classList.add('vowel');
      span.dataset.index = i;
      span.tabIndex = 0;
      span.setAttribute('role', 'button');

      const act = () => answer(i, span);
      span.addEventListener('click', act);
      span.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); act(); }
      });
    }
    frag.appendChild(span);
  });

  ui.word.replaceChildren(frag);
}

function markLetter(index, cls) {
  const node = ui.word.querySelector('.letter[data-index="' + index + '"]');
  if (node) node.classList.add(cls);
}

function requeue() {
  if (queue.length < 2) return;
  const [first] = queue.splice(0, 1);
  const pos = 1 + Math.floor(Math.random() * queue.length);
  queue.splice(pos, 0, first);
}

function answer(index, node) {
  if (locked || !current) return;
  locked = true;

  const item = current;
  const hit = item.answers.some(a => a.index === index);

  if (hit) {
    node.classList.add('correct');
    queue.shift();
    okTotal++;
    ui.feedback.className = 'feedback ok';
    ui.feedback.textContent = item.answers.length > 1
      ? 'Верно! Допустимо: ' + item.answers.map(a => a.form).join(' и ')
      : 'Верно!';
    updateStats();
    answerTimer = setTimeout(nextQuestion, DELAY_OK);
  } else {
    node.classList.add('wrong');
    item.answers.forEach(a => markLetter(a.index, 'correct'));
    errTotal++;
    roundErrors.add(item.id);
    ui.feedback.className = 'feedback err';

    let html = 'Неверно. Правильно: <b>' +
      item.answers.map(a => a.form).join(' или ') + '</b>';

    if (item.variants && item.variants.length > 1) {
      const note = item.variants.map(v =>
        escapeHtml(v.form) + (v.hint ? ' — ' + escapeHtml(v.hint) : '')
      ).join('; ');
      html += '<span class="note">Ударение зависит от значения: ' + note + '</span>';
    }
    ui.feedback.innerHTML = html;
    updateStats();
    requeue();
    answerTimer = setTimeout(nextQuestion, DELAY_ERR);
  }
}

function updateStats() {
  ui.okCount.textContent = okTotal;
  ui.errCount.textContent = errTotal;
  const total = allItems.length;
  const done = total - queue.length;
  ui.bar.style.width = (total ? (done / total) * 100 : 0) + '%';
}

function finishRound() {
  clearInterval(tickTimer);
  current = null;

  const total = allItems.length;
  const seconds = elapsed();
  const minutes = seconds / 60;
  const speed = minutes > 0 ? Math.round(total / minutes) : 0;
  const mistakes = roundErrors.size;
  const accuracy = total ? Math.max(0, Math.round((total - mistakes) / total * 100)) : 100;
  const pct = total ? (mistakes / total) * 100 : 0;
  const zone = ZONES.find(z => pct <= z.max) || ZONES[ZONES.length - 1];

  ui.timeVal.textContent = fmtTime(seconds);
  ui.speedVal.textContent = speed;
  ui.bar.style.width = '100%';

  ui.finish.dataset.tone = zone.tone;
  ui.finishEmoji.textContent = zone.emoji;
  ui.finishTitle.textContent = zone.title;
  ui.finishText.textContent = zone.text;
  ui.finishMetrics.innerHTML =
    metric('Время', fmtTime(seconds)) +
    metric('Темп', speed + '<i>/мин</i>') +
    metric('Точность', accuracy + '%') +
    metric('Ошибок', String(errTotal));

  ui.game.classList.add('hidden');
  ui.stats.classList.add('hidden');
  ui.finish.classList.remove('hidden');
}

function updateThemeColor(theme) {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = theme === 'dark' ? '#1c2026' : '#f6f7f9';
}

function setupTheme() {
  let stored = null;
  try { stored = localStorage.getItem('theme'); } catch (e) {}
  const theme = stored === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  updateThemeColor(theme);

  ui.themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    updateThemeColor(next);
  });
}

ui.builtinBtn.addEventListener('click', () => startWithRows(BUILTIN));

ui.fileBtn.addEventListener('click', () => ui.fileInput.click());

ui.fileInput.addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  if (typeof XLSX === 'undefined') {
    alert('Не удалось загрузить библиотеку для чтения XLSX. Проверьте подключение к интернету.');
    return;
  }

  const reader = new FileReader();
  reader.onload = ev => {
    try { startWithRows(parseWorkbook(ev.target.result)); }
    catch (err) { alert('Не удалось прочитать файл: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

ui.restartBtn.addEventListener('click', startRound);

setupTheme();

})();
</script>
